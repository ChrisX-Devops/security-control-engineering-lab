# =============================================================
# UNIFIED DASHBOARD VALIDATION PIPELINE
# =============================================================
# Purpose:
#   Validates the unified compliance dashboard structure,
#   Python syntax, and scoring engine logic.
#
# This is the most important pipeline because the dashboard
# is the final deliverable that clients and auditors see.
# =============================================================

name: Unified Dashboard Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  validate-dashboard:
    name: Validate Dashboard Structure and Logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify all dashboard files exist
        run: |
          echo "Checking dashboard files..."

          FILES=(
            "projects/project-04-unified-dashboard/run_dashboard.py"
            "projects/project-04-unified-dashboard/collectors/collect_sql_findings.py"
            "projects/project-04-unified-dashboard/collectors/collect_aws_findings.py"
            "projects/project-04-unified-dashboard/collectors/scoring_engine.py"
            "projects/project-04-unified-dashboard/collectors/generate_unified_report.py"
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "  [OK] $file"
            else
              echo "  [MISSING] $file"
              exit 1
            fi
          done

      - name: Check Python syntax on all dashboard files
        run: |
          echo "Checking Python syntax..."

          for file in \
            projects/project-04-unified-dashboard/collectors/*.py \
            projects/project-04-unified-dashboard/run_dashboard.py; do
            python3 -m py_compile "$file"
            echo "  [OK] $file"
          done

      - name: Test scoring engine logic
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(
              0,
              "projects/project-04-unified-dashboard/collectors"
          )
          from scoring_engine import calculate_score, prioritize_findings

          # Test 1: Empty findings = perfect score
          result = calculate_score([])
          assert result["overall_score"] == 100, \
              f"Empty findings should score 100, got {result['overall_score']}"
          print("PASS: Empty findings = 100/100")

          # Test 2: One CRITICAL finding deducts 20 points
          findings = [{"severity": "CRITICAL", "category": "access_control"}]
          result = calculate_score(findings)
          assert result["overall_score"] == 80, \
              f"One CRITICAL should score 80, got {result['overall_score']}"
          print("PASS: One CRITICAL finding = 80/100")

          # Test 3: Score cannot go below 0
          findings = [{"severity": "CRITICAL", "category": "test"}] * 10
          result = calculate_score(findings)
          assert result["overall_score"] == 0, \
              f"Score should floor at 0, got {result['overall_score']}"
          print("PASS: Score floors at 0")

          # Test 4: Grade assignment
          findings = []
          result = calculate_score(findings)
          assert result["grade"] == "A", \
              f"100/100 should be grade A, got {result['grade']}"
          print("PASS: 100/100 = Grade A")

          # Test 5: Prioritization puts CRITICAL first
          findings = [
              {"severity": "LOW",      "category": "test"},
              {"severity": "CRITICAL", "category": "test"},
              {"severity": "MEDIUM",   "category": "test"},
              {"severity": "HIGH",     "category": "test"}
          ]
          sorted_f = prioritize_findings(findings)
          assert sorted_f[0]["severity"] == "CRITICAL", \
              "First finding should be CRITICAL"
          assert sorted_f[-1]["severity"] == "LOW", \
              "Last finding should be LOW"
          print("PASS: Findings prioritized CRITICAL → LOW")

          print("")
          print("All scoring engine tests passed")
          EOF

      - name: Test unified finding format validation
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(
              0,
              "projects/project-04-unified-dashboard/collectors"
          )
          from scoring_engine import calculate_score

          required_fields = [
              "finding_id", "source", "control_id",
              "title", "severity", "status",
              "resource", "description", "framework", "category"
          ]

          sample_finding = {
              "finding_id":  "TEST-001",
              "source":      "test",
              "control_id":  "CTL-01",
              "title":       "Test Finding",
              "severity":    "HIGH",
              "status":      "FAIL",
              "resource":    "test/resource",
              "description": "Test description",
              "framework":   "SOC2 CC6.1",
              "category":    "access_control"
          }

          for field in required_fields:
              assert field in sample_finding, \
                  f"Required field missing: {field}"

          print(f"Unified finding format validated")
          print(f"Required fields: {required_fields}")
          EOF

      - name: Verify README exists
        run: |
          if [ -f "projects/project-04-unified-dashboard/README.md" ]; then
            SIZE=$(wc -c < "projects/project-04-unified-dashboard/README.md")
            echo "[OK] README.md exists ($SIZE bytes)"
          else
            echo "[MISSING] README.md"
            exit 1
          fi

  compliance-gate:
    name: Compliance Gate
    runs-on: ubuntu-latest
    needs: validate-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scoring engine compliance gate
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(
              0,
              "projects/project-04-unified-dashboard/collectors"
          )
          from scoring_engine import calculate_score

          # Simulate findings from the last known report
          # In a real pipeline this would read the actual report
          simulated_findings = [
              {"severity": "CRITICAL", "category": "access_control"},
              {"severity": "CRITICAL", "category": "identity"},
              {"severity": "CRITICAL", "category": "access_control"},
              {"severity": "CRITICAL", "category": "identity"},
              {"severity": "HIGH",     "category": "access_control"},
              {"severity": "HIGH",     "category": "access_control"},
              {"severity": "HIGH",     "category": "access_control"},
              {"severity": "HIGH",     "category": "access_control"},
              {"severity": "MEDIUM",   "category": "access_control"},
              {"severity": "LOW",      "category": "identity"}
          ]

          score = calculate_score(simulated_findings)

          print(f"Compliance Score: {score['overall_score']}/100")
          print(f"Grade:            {score['grade']}")
          print(f"Status:           {score['status']}")
          print(f"Critical Count:   {score['counts']['CRITICAL']}")

          # Compliance gate: warn if score is below 70
          # In production this would be a hard failure
          if score["overall_score"] < 70:
              print("")
              print("WARNING: Compliance score below 70%")
              print("Review and remediate findings before audit")
              print("This is informational only - build continues")
          else:
              print("")
              print("Compliance score meets minimum threshold")
          EOF
